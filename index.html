<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firmware-Agent</title>
<style>
  :root {
    --bg: #f4f5f8; --panel: #ffffff; --ink: #1d2230; --muted: #667085; --line: #e2e5ec;
    --accent: #4472c4; --accent-ink: #ffffff; --warm: #ed7d31;
    --user: #4472c4; --user-ink: #ffffff; --agent: #ffffff;
    --add: #e5f4ea; --add-ink: #14532d; --del: #fdebea; --del-ink: #7f1d1d;
    --err: #fdebea; --err-ink: #9b1c1c; --chip: #eaeef7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13151a; --panel: #1b1e25; --ink: #e8eaf0; --muted: #98a0ae; --line: #2a2f39;
      --accent: #6e96e6; --accent-ink: #0e1422; --warm: #f19a5c;
      --user: #31467a; --user-ink: #ffffff; --agent: #1b1e25;
      --add: #12301f; --add-ink: #9be3b4; --del: #3a1c1c; --del-ink: #f3b4b4;
      --err: #3a1c1c; --err-ink: #f3b4b4; --chip: #252a36;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    border-top: 4px solid var(--accent);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header .meta { color: var(--muted); font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; cursor: pointer; }
  .ghost {
    background: transparent; color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px;
  }
  .ghost:hover { border-color: var(--accent); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .col { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.md { white-space: normal; }
  .msg.md p { margin: 0 0 8px; }
  .msg.md ul { margin: 0 0 8px; padding-left: 20px; }
  .msg.md li { margin: 3px 0; }
  .msg.md .md-h { font-weight: 650; margin: 6px 0 4px; }
  .msg.md code { font-family: ui-monospace, Consolas, monospace; font-size: .92em; background: rgba(127,127,127,.18); padding: 1px 5px; border-radius: 5px; }
  .msg.md > :last-child { margin-bottom: 0; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--agent); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .chip {
    align-self: flex-start; font-size: 13px; color: var(--muted); background: var(--chip);
    padding: 3px 10px; border-radius: 999px;
  }
  .note { align-self: stretch; padding: 10px 14px; border-radius: 10px; background: var(--err); color: var(--err-ink); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }

  .card { align-self: stretch; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--warm); border-radius: 10px; padding: 12px 14px; }
  .card h2 { font-size: 15px; margin: 0 0 8px; }
  .card .file { font-family: ui-monospace, Consolas, monospace; }
  .diff { font: 13px/1.5 ui-monospace, Consolas, "Cascadia Mono", monospace; border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; max-height: 320px; overflow-y: auto; }
  .diff div { padding: 0 10px; white-space: pre; }
  .diff .add { background: var(--add); color: var(--add-ink); }
  .diff .del { background: var(--del); color: var(--del-ink); }
  .diff .gap { color: var(--muted); text-align: center; background: var(--chip); }
  .actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .btn { border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 600; }
  .btn.ok { background: var(--accent); color: var(--accent-ink); }
  .btn.no { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn:disabled { opacity: .5; cursor: default; }
  .result { font-size: 14px; color: var(--muted); }

  .empty { text-align: center; color: var(--muted); margin-top: 8vh; }
  .empty h2 { color: var(--ink); font-size: 20px; margin-bottom: 4px; }
  .examples { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 16px; }
  .examples button {
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: 999px; padding: 8px 16px; max-width: 100%;
  }
  .examples button:hover { border-color: var(--accent); }

  .typing { align-self: flex-start; color: var(--muted); font-size: 14px; }
  .typing::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @media (prefers-reduced-motion: reduce) { .typing::after { animation: none; content: "…"; } }

  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 12px 16px 10px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; max-height: 160px;
  }
  .send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 650; }
  .send:disabled { opacity: .5; cursor: default; }
  [hidden] { display: none !important; }
  .stop { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; font-weight: 600; }
  .stop:hover { border-color: var(--warm); }
  .hint { max-width: 760px; margin: 6px auto 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Firmware-Agent</h1>
  <div class="meta" id="meta">verbinde …</div>
  <button class="ghost" id="reset" type="button">Neues Gespräch</button>
</header>

<main id="main" aria-live="polite">
  <div class="col" id="chat"></div>
</main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Was soll der Agent tun?" aria-label="Nachricht an den Agenten"></textarea>
    <button class="stop" id="stop" type="button" hidden>Stopp</button>
    <button class="send" id="send" type="submit">Senden</button>
  </form>
  <div class="hint">Enter sendet, Umschalt+Enter macht eine neue Zeile. Der Agent läuft auf deinem Rechner. Dateiinhalte, die er liest, gehen zur Verarbeitung an die API.</div>
</footer>

<script>
const chat = document.getElementById('chat');
const main = document.getElementById('main');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const stopBtn = document.getElementById('stop');
const meta = document.getElementById('meta');
let busy = false;
let typingEl = null;
const cards = new Map();

const EXAMPLES = [
  'Lies die Datei und erkläre mir kurz, was sie macht. Ändere nichts.',
  'Zeig mir, welche Dateien im Ordner liegen.'
];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
// Kleine, sichere Darstellung für **fett**, `code`, Listen, Überschriften und Absätze (nur DOM, kein innerHTML)
function inline(parent, text) {
  const re = /(\*\*[^*]+\*\*|`[^`]+`)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parent.append(text.slice(last, m.index));
    const t = m[0];
    parent.append(el(t[0] === '`' ? 'code' : 'strong', '', t.slice(t[0] === '`' ? 1 : 2, t[0] === '`' ? -1 : -2)));
    last = m.index + t.length;
  }
  if (last < text.length) parent.append(text.slice(last));
}
function renderAgent(text) {
  const box = el('div', 'msg agent md');
  let list = null, para = null;
  for (const raw of String(text).split('\n')) {
    const line = raw.trimEnd();
    const li = line.match(/^\s*[-*]\s+(.*)$/), h = line.match(/^#{1,6}\s+(.*)$/);
    if (li) {
      para = null;
      if (!list) { list = el('ul'); box.append(list); }
      const item = el('li'); inline(item, li[1]); list.append(item);
    } else if (!line.trim()) {
      list = null; para = null;
    } else {
      list = null;
      if (h) { const hh = el('div', 'md-h'); inline(hh, h[1]); box.append(hh); para = null; }
      else {
        if (!para) { para = el('p'); box.append(para); } else para.append(document.createElement('br'));
        inline(para, line);
      }
    }
  }
  return box;
}
function scrollDown() { main.scrollTop = main.scrollHeight; }
function clearEmpty() { const e = document.getElementById('empty'); if (e) e.remove(); }

function showEmpty() {
  const box = el('div', 'empty');
  box.id = 'empty';
  box.append(el('h2', '', 'Womit soll ich anfangen?'));
  box.append(el('div', '', 'Schreib ein Ziel in normaler Sprache. Bevor eine Datei geändert wird, siehst du den Vergleich und entscheidest.'));
  const ex = el('div', 'examples');
  for (const t of EXAMPLES) {
    const b = el('button', '', t);
    b.type = 'button';
    b.onclick = () => { input.value = t; input.focus(); autosize(); };
    ex.append(b);
  }
  box.append(ex);
  chat.append(box);
}

let timer = null, since = 0;
function tick() { if (typingEl) typingEl.textContent = 'Agent arbeitet · ' + Math.round((Date.now() - since) / 1000) + ' s'; }
function setBusy(v, seit) {
  busy = v;
  sendBtn.disabled = v;
  stopBtn.hidden = !v;
  if (v) {
    since = seit || Date.now();
    if (!typingEl) { typingEl = el('div', 'typing'); chat.append(typingEl); scrollDown(); }
    tick();
    if (!timer) timer = setInterval(tick, 1000);
  } else {
    if (typingEl) { typingEl.remove(); typingEl = null; }
    clearInterval(timer); timer = null;
  }
}
function keepTypingLast() { if (typingEl) chat.append(typingEl); }

function toolText(ev) {
  if (ev.name === 'dateien_auflisten') return 'schaut sich die Dateien im Ordner an';
  if (ev.name === 'datei_lesen') return 'liest ' + (ev.pfad || 'eine Datei');
  if (ev.name === 'suchen') return 'sucht in ' + (ev.pfad || 'einer Datei');
  if (ev.name === 'stelle_ersetzen') return 'bereitet eine Änderung an ' + (ev.pfad || 'einer Datei') + ' vor';
  if (ev.name === 'datei_schreiben') return 'bereitet eine Änderung an ' + (ev.pfad || 'einer Datei') + ' vor';
  return ev.name;
}

function renderConfirm(ev) {
  const card = el('div', 'card');
  const h = el('h2');
  h.append(ev.neueDatei ? 'Neue Datei anlegen: ' : 'Änderung erlauben: ');
  h.append(el('span', 'file', ev.pfad));
  card.append(h);
  if (ev.diff) {
    const d = el('div', 'diff');
    for (const [sign, line] of ev.diff) {
      const row = el('div', sign === '+' ? 'add' : sign === '-' ? 'del' : sign === '…' ? 'gap' : '');
      row.textContent = sign === '…' ? '…' : sign + ' ' + line;
      d.append(row);
    }
    card.append(d);
  } else {
    card.append(el('div', 'result', 'Die Datei ist zu groß für einen Vergleich.'));
  }
  const act = el('div', 'actions');
  const ok = el('button', 'btn ok', 'Erlauben'); ok.type = 'button';
  const no = el('button', 'btn no', 'Ablehnen'); no.type = 'button';
  const res = el('span', 'result');
  const answer = (v) => {
    ok.disabled = no.disabled = true;
    fetch('/api/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: ev.id, ok: v }) });
  };
  ok.onclick = () => answer(true);
  no.onclick = () => answer(false);
  act.append(ok, no, res);
  card.append(act);
  cards.set(ev.id, { ok, no, res });
  chat.append(card);
  if (!document.hasFocus()) document.title = '● Rückfrage – Firmware-Agent';
  setTimeout(() => ok.focus({ preventScroll: true }), 0);
}

function handle(ev) {
  if (ev.type === 'info') {
    chat.innerHTML = ''; typingEl = null; cards.clear(); setBusy(false);
    const name = ev.ordner.split(/[\\/]/).filter(Boolean).pop();
    meta.textContent = 'Ordner: ' + name + ' · Modell: ' + ev.modell;
    meta.title = ev.ordner;
    showEmpty();
    return;
  }
  if (ev.type === 'reset') { chat.innerHTML = ''; typingEl = null; cards.clear(); showEmpty(); return; }
  if (ev.type === 'status') { setBusy(ev.busy, ev.seit); return; }
  clearEmpty();
  if (ev.type === 'user') chat.append(el('div', 'msg user', ev.text));
  else if (ev.type === 'text') chat.append(renderAgent(ev.text));
  else if (ev.type === 'tool') chat.append(el('div', 'chip', toolText(ev)));
  else if (ev.type === 'confirm') renderConfirm(ev);
  else if (ev.type === 'confirm_result') {
    const c = cards.get(ev.id);
    if (c) { c.ok.disabled = c.no.disabled = true; c.res.textContent = ev.ok ? 'Erlaubt, Datei geschrieben.' : 'Abgelehnt.'; }
    document.title = 'Firmware-Agent';
  }
  else if (ev.type === 'notiz') chat.append(el('div', 'chip', ev.text));
  else if (ev.type === 'error') chat.append(el('div', 'note', ev.text));
  keepTypingLast();
  scrollDown();
}

const es = new EventSource('/api/events');
es.onmessage = (e) => handle(JSON.parse(e.data));
es.onerror = () => { meta.textContent = 'Server nicht erreichbar. Wurde das schwarze Fenster geschlossen? Dann start.bat neu starten. Die Seite verbindet sich danach selbst.'; };
window.addEventListener('focus', () => { document.title = 'Firmware-Agent'; });

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  const r = await fetch('/api/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
  if (r.ok) { input.value = ''; autosize(); }
  else { const j = await r.json().catch(() => ({})); chat.append(el('div', 'note', j.error || 'Senden fehlgeschlagen')); scrollDown(); }
}
document.getElementById('form').addEventListener('submit', (e) => { e.preventDefault(); send(); });
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; }
input.addEventListener('input', autosize);

stopBtn.onclick = () => fetch('/api/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
document.getElementById('reset').onclick = async () => {
  const r = await fetch('/api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  if (!r.ok) { chat.append(el('div', 'note', 'Während der Agent arbeitet, geht das nicht.')); scrollDown(); }
};
input.focus();
</script>
</body>
</html>
